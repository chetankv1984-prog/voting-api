<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PollPop — live polls</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>" />
  <style>
    :root {
      --bg: #0b0820; --bg2: #1c0f45;
      --card: rgba(255,255,255,.06); --card-strong: rgba(255,255,255,.1); --border: rgba(255,255,255,.12);
      --text: #f5f3ff; --muted: #a9a3d1;
      --pink: #ff5d8f; --violet: #7c5cff; --cyan: #22d3ee; --ok: #4ade80; --err: #fb7185;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
      --radius: 20px;
    }
    [data-theme="light"] {
      --bg: #fff1f8; --bg2: #e3f2ff;
      --card: rgba(255,255,255,.72); --card-strong: rgba(255,255,255,.9); --border: rgba(90,50,170,.14);
      --text: #1e1b4b; --muted: #6a6795;
      --shadow: 0 24px 50px rgba(90,50,170,.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg), var(--bg2)) fixed;
      min-height: 100vh; overflow-x: hidden;
      transition: background .4s, color .4s;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }

    /* Animated background blobs */
    .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .45; z-index: -1; animation: float 20s ease-in-out infinite; pointer-events: none; }
    .b1 { width: 440px; height: 440px; background: var(--pink); top: -140px; left: -120px; }
    .b2 { width: 400px; height: 400px; background: var(--violet); bottom: -140px; right: -100px; animation-delay: -7s; }
    .b3 { width: 320px; height: 320px; background: var(--cyan); top: 40%; left: 45%; animation-delay: -14s; opacity: .3; }
    @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(70px,-50px) scale(1.1); } 66% { transform: translate(-50px,60px) scale(.95); } }

    .glass { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--shadow); }

    /* Header */
    header { max-width: 1180px; margin: 0 auto; padding: 22px 20px 6px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    .logo .mark { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; background: conic-gradient(from 200deg, var(--pink), #ffb547, var(--ok), var(--cyan), var(--violet), var(--pink)); animation: spin 12s linear infinite; }
    .logo .mark span { animation: spin 12s linear infinite reverse; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .grad { background: linear-gradient(90deg, var(--pink), #ffb547, var(--cyan), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% auto; animation: shimmer 6s linear infinite; }
    @keyframes shimmer { to { background-position: 200% center; } }
    .spacer { flex: 1; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(74,222,128,.7); animation: ping 1.8s infinite; }
    .dot.off { background: var(--err); animation: none; }
    @keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
    .icon-btn { border: 1px solid var(--border); background: var(--card); border-radius: 999px; width: 40px; height: 40px; font-size: 18px; transition: transform .2s; }
    .icon-btn:hover { transform: rotate(20deg) scale(1.08); }

    .btn { border: none; border-radius: 14px; padding: 12px 20px; font-weight: 700; color: #fff; background: linear-gradient(135deg, var(--pink), var(--violet)); box-shadow: 0 10px 24px rgba(124,92,255,.35); transition: transform .15s, box-shadow .2s, opacity .2s; }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(255,93,143,.4); }
    .btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
    .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .btn.ghost { background: var(--card-strong); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
    .btn.small { padding: 8px 14px; font-size: 14px; border-radius: 12px; }

    /* Layout */
    .layout { max-width: 1180px; margin: 0 auto; padding: 16px 20px 40px; display: grid; grid-template-columns: 290px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

    /* Sidebar */
    aside { padding: 18px; position: sticky; top: 16px; }
    @media (max-width: 880px) { aside { position: static; } }
    aside h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
    .search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-strong); outline: none; margin-bottom: 12px; }
    .search:focus { border-color: var(--violet); }
    .poll-list { display: grid; gap: 8px; max-height: 60vh; overflow: auto; padding-right: 2px; }
    .poll-item { text-align: left; border: 1px solid transparent; background: var(--card-strong); border-radius: 14px; padding: 12px; transition: transform .15s, border-color .2s; }
    .poll-item:hover { transform: translateX(4px); }
    .poll-item.active { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,93,143,.18); }
    .poll-item .q { font-weight: 650; font-size: 14px; margin-bottom: 8px; display: flex; gap: 6px; align-items: start; }
    .poll-item .q span:first-child { flex: 1; }
    .poll-item .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(74,222,128,.18); color: var(--ok); font-weight: 700; white-space: nowrap; }
    .mini { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--border); }
    .mini span { height: 100%; transition: width .6s ease; }
    aside .btn { width: 100%; margin-top: 14px; }

    /* Main poll card */
    main { display: grid; gap: 20px; }
    .poll-card { padding: 28px; position: relative; overflow: hidden; }
    .poll-top { display: flex; gap: 12px; align-items: start; flex-wrap: wrap; }
    .poll-top h1 { flex: 1; margin: 0; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.2; min-width: 240px; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 20px; }
    .stat { padding: 8px 14px; border-radius: 12px; background: var(--card-strong); font-size: 14px; color: var(--muted); }
    .stat b { color: var(--text); font-size: 16px; }

    .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
    .opt { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; border: 2px solid var(--border); background: var(--card-strong); text-align: left; transition: transform .15s, border-color .2s, box-shadow .2s; }
    .opt:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--c); }
    .opt.selected { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent), 0 12px 28px color-mix(in srgb, var(--c) 35%, transparent); transform: translateY(-3px); }
    .opt.mine { border-color: var(--c); }
    .opt:disabled { cursor: default; }
    .opt .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 40%, transparent), color-mix(in srgb, var(--c) 18%, transparent)); transition: width .8s cubic-bezier(.2,.8,.2,1); z-index: 0; }
    .opt > *:not(.fill) { position: relative; z-index: 1; }
    .opt .num { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--c); box-shadow: 0 6px 14px color-mix(in srgb, var(--c) 45%, transparent); }
    .opt .label { flex: 1; font-weight: 650; font-size: 16px; word-break: break-word; }
    .opt .pct { font-weight: 800; font-size: 15px; text-align: right; white-space: nowrap; }
    .opt .pct small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
    .opt.pulse { animation: pulse .7s ease; }
    @keyframes pulse { 40% { transform: scale(1.035); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 35%, transparent); } }

    .vote-row { display: flex; align-items: center; gap: 14px; margin-top: 20px; flex-wrap: wrap; }
    .hint { color: var(--muted); font-size: 13px; }
    kbd { padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-strong); font-size: 12px; }
    .voted-msg { color: var(--ok); font-weight: 700; }

    /* Bottom panels */
    .panels { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
    @media (max-width: 720px) { .panels { grid-template-columns: 1fr; } }
    .panel { padding: 22px; }
    .panel h3 { margin: 0 0 14px; font-size: 16px; }
    .chart-wrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .donut { width: 170px; height: 170px; flex: none; }
    .donut circle.seg { transition: stroke-dasharray .8s ease, stroke-dashoffset .8s ease; }
    .donut text { fill: var(--text); }
    .legend { display: grid; gap: 8px; flex: 1; min-width: 150px; font-size: 14px; }
    .legend div { display: flex; align-items: center; gap: 8px; }
    .legend i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
    .legend span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 240px; overflow: auto; }
    .feed li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--card-strong); font-size: 14px; animation: slideIn .35s ease; }
    .feed li time { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .feed .empty { color: var(--muted); background: none; padding: 4px 0; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } }

    /* Modal */
    dialog { border: none; padding: 0; background: transparent; color: var(--text); width: min(540px, 94vw); }
    dialog::backdrop { background: rgba(10,5,30,.6); backdrop-filter: blur(4px); }
    .modal { padding: 26px; background: var(--bg2); }
    [data-theme="light"] .modal { background: #fff; }
    .modal h2 { margin: 0 0 18px; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .field input { padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card-strong); outline: none; }
    .field input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(124,92,255,.2); }
    .opt-input { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .opt-input i { width: 12px; height: 34px; border-radius: 6px; flex: none; }
    .opt-input input { flex: 1; }
    .opt-input button { border: none; background: none; font-size: 18px; color: var(--muted); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .form-err { color: var(--err); font-size: 14px; min-height: 20px; }

    /* Toasts */
    .toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 10px; z-index: 50; }
    .toast { padding: 12px 18px; border-radius: 14px; font-weight: 600; color: #fff; box-shadow: var(--shadow); animation: toastIn .3s ease; max-width: 320px; }
    .toast.ok { background: linear-gradient(135deg, #22c55e, #14b8a6); }
    .toast.err { background: linear-gradient(135deg, #f43f5e, #f97316); }
    .toast.info { background: linear-gradient(135deg, var(--violet), var(--cyan)); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }

    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
    footer { text-align: center; color: var(--muted); font-size: 13px; padding-bottom: 26px; }
  </style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <canvas id="confetti"></canvas>

  <header>
    <div class="logo"><div class="mark"><span>🗳️</span></div><span class="grad">PollPop</span></div>
    <div class="spacer"></div>
    <div class="pill glass" title="People with this site open right now"><span id="liveDot" class="dot off"></span><span id="online">Connecting…</span></div>
    <button id="themeBtn" class="icon-btn" title="Switch light/dark theme">🌙</button>
  </header>

  <div class="layout">
    <aside class="glass">
      <h3>All polls</h3>
      <input id="search" class="search" placeholder="🔍  Search polls…" />
      <div id="pollList" class="poll-list"></div>
      <button id="newPollBtn" class="btn">✨ Create a poll</button>
    </aside>

    <main>
      <section class="poll-card glass">
        <div class="poll-top">
          <h1 id="question">Loading…</h1>
          <button id="shareBtn" class="btn ghost small" title="Copy a link to this poll">🔗 Share</button>
        </div>
        <div class="stats">
          <div class="stat">🗳️ <b id="totalVotes">0</b> votes</div>
          <div class="stat">👥 <b id="totalVoters">0</b> voters</div>
          <div class="stat">🏆 Leading: <b id="leader">—</b></div>
        </div>
        <div id="options" class="options"></div>
        <div class="vote-row">
          <button id="voteBtn" class="btn">Submit vote 🚀</button>
          <span id="voteHint" class="hint">Pick an option, or press <kbd>1</kbd>–<kbd>9</kbd></span>
        </div>
      </section>

      <div class="panels">
        <section class="panel glass">
          <h3>📊 Results</h3>
          <div class="chart-wrap">
            <svg id="donut" class="donut" viewBox="0 0 42 42"></svg>
            <div id="legend" class="legend"></div>
          </div>
        </section>
        <section class="panel glass">
          <h3>⚡ Live activity</h3>
          <ul id="feed" class="feed"><li class="empty">Votes will appear here as they happen.</li></ul>
        </section>
      </div>
    </main>
  </div>

  <footer>One vote per person per poll · results update live for everyone</footer>

  <dialog id="createDialog">
    <form id="createForm" class="modal glass" method="dialog">
      <h2>✨ <span class="grad">New poll</span></h2>
      <div class="field">
        <label for="fQuestion">Question</label>
        <input id="fQuestion" maxlength="300" placeholder="e.g. Where should we go for lunch?" required />
      </div>
      <div class="field">
        <label>Options (2–20)</label>
        <div id="fOptions"></div>
        <button type="button" id="addOptBtn" class="btn ghost small">+ Add option</button>
      </div>
      <div id="formErr" class="form-err"></div>
      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
        <button type="submit" class="btn">Create poll 🎉</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts"></div>

  <script>
    // ---------- Helpers ----------
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const PALETTE = ["#ff5d8f", "#ffb547", "#4ade80", "#38bdf8", "#a78bfa", "#f97316", "#22d3ee", "#facc15", "#e879f9", "#34d399"];
    const color = (i) => i < PALETTE.length ? PALETTE[i] : `hsl(${(i * 47) % 360} 85% 62%)`;
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    const pctOf = (n, total) => total > 0 ? (n / total) * 100 : 0;
    const timeNow = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

    const state = { polls: new Map(), currentId: null, selected: null, filter: "" };
    const current = () => state.polls.get(state.currentId);

    function toast(msg, type = "info") {
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = msg;
      $("#toasts").appendChild(el);
      setTimeout(() => { el.style.transition = "opacity .4s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 400); }, 2800);
    }

    // ---------- Theme ----------
    function setTheme(t) {
      document.documentElement.dataset.theme = t;
      $("#themeBtn").textContent = t === "dark" ? "🌙" : "☀️";
      localStorage.setItem("pollpop-theme", t);
    }
    setTheme(localStorage.getItem("pollpop-theme") || "dark");
    $("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

    // ---------- Sidebar ----------
    function renderSidebar() {
      const list = $("#pollList");
      const f = state.filter.toLowerCase();
      const items = [...state.polls.values()].filter(p => p.question.toLowerCase().includes(f));
      list.innerHTML = items.length ? "" : `<div class="hint">No polls match.</div>`;
      items.forEach(p => {
        const total = sum(p.votes);
        const btn = document.createElement("button");
        btn.className = "poll-item" + (p.id === state.currentId ? " active" : "");
        const bars = total
          ? p.votes.map((v, i) => `<span style="width:${pctOf(v, total)}%;background:${color(i)}"></span>`).join("")
          : `<span style="width:100%;background:var(--border)"></span>`;
        btn.innerHTML = `
          <div class="q"><span>${esc(p.question)}</span>${p.youVoted ? '<span class="badge">✓ voted</span>' : ""}</div>
          <div class="mini">${bars}</div>
          <div class="meta">${total} vote${total === 1 ? "" : "s"} · ${p.options.length} options</div>`;
        btn.onclick = () => { location.hash = "#/" + encodeURIComponent(p.id); };
        list.appendChild(btn);
      });
    }
    $("#search").addEventListener("input", (e) => { state.filter = e.target.value; renderSidebar(); });

    // ---------- Poll view ----------
    function buildOptions() {
      const p = current();
      $("#question").textContent = p.question;
      document.title = `${p.question} · PollPop`;
      const wrap = $("#options");
      wrap.innerHTML = "";
      p.options.forEach((opt, i) => {
        const b = document.createElement("button");
        b.className = "opt";
        b.dataset.idx = i;
        b.style.setProperty("--c", color(i));
        b.innerHTML = `<span class="fill"></span><span class="num">${i + 1}</span><span class="label">${esc(opt)}</span><span class="pct"></span>`;
        b.onclick = () => selectOption(i);
        wrap.appendChild(b);
      });
      $("#feed").innerHTML = `<li class="empty">Votes will appear here as they happen.</li>`;
      updateResults();
    }

    function selectOption(i) {
      const p = current();
      if (!p || p.youVoted) return;
      state.selected = i;
      document.querySelectorAll(".opt").forEach(el => el.classList.toggle("selected", Number(el.dataset.idx) === i));
      $("#voteBtn").disabled = false;
    }

    function updateResults() {
      const p = current();
      if (!p) return;
      const total = sum(p.votes);
      const max = Math.max(...p.votes);
      document.querySelectorAll(".opt").forEach(el => {
        const i = Number(el.dataset.idx);
        const n = p.votes[i];
        const pct = pctOf(n, total);
        el.querySelector(".fill").style.width = pct + "%";
        el.querySelector(".pct").innerHTML = `${total && n === max ? "👑 " : ""}${Math.round(pct)}%<small>${n} vote${n === 1 ? "" : "s"}</small>`;
        el.disabled = !!p.youVoted;
        el.classList.toggle("mine", p.youVoted && p.myChoice === i);
      });
      $("#totalVotes").textContent = total;
      $("#totalVoters").textContent = p.totalVoters;
      const leaders = total ? p.options.filter((_, i) => p.votes[i] === max) : [];
      $("#leader").textContent = !total ? "—" : leaders.length > 1 ? "Tie!" : leaders[0];

      const vb = $("#voteBtn");
      if (p.youVoted) {
        vb.disabled = true;
        vb.textContent = "Voted ✅";
        $("#voteHint").innerHTML = `<span class="voted-msg">Thanks for voting! Watch the results update live.</span>`;
      } else {
        vb.disabled = state.selected === null;
        vb.textContent = "Submit vote 🚀";
        $("#voteHint").innerHTML = `Pick an option, or press <kbd>1</kbd>–<kbd>9</kbd>`;
      }
      renderDonut(p, total);
    }

    function renderDonut(p, total) {
      const svg = $("#donut");
      const R = 15.915; // circumference = 100, so dash lengths are percentages
      let html = `<circle cx="21" cy="21" r="${R}" fill="none" stroke="var(--border)" stroke-width="5"></circle>`;
      let offset = 25; // start at 12 o'clock
      if (total) {
        p.votes.forEach((v, i) => {
          const pct = pctOf(v, total);
          if (!pct) return;
          html += `<circle class="seg" cx="21" cy="21" r="${R}" fill="none" stroke="${color(i)}" stroke-width="5"
                    stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${offset}"></circle>`;
          offset -= pct;
        });
      }
      html += `<text x="21" y="21" text-anchor="middle" font-size="7" font-weight="800">${total}</text>
               <text x="21" y="26.5" text-anchor="middle" font-size="3" opacity=".7">votes</text>`;
      svg.innerHTML = html;
      $("#legend").innerHTML = p.options.map((o, i) =>
        `<div><i style="background:${color(i)}"></i><span title="${esc(o)}">${esc(o)}</span><b>${Math.round(pctOf(p.votes[i], total))}%</b></div>`
      ).join("");
    }

    function addActivity(html, c) {
      const feed = $("#feed");
      feed.querySelector(".empty")?.remove();
      const li = document.createElement("li");
      li.innerHTML = `<span style="color:${c || "var(--cyan)"}">●</span><span>${html}</span><time>${timeNow()}</time>`;
      feed.prepend(li);
      while (feed.children.length > 12) feed.lastChild.remove();
    }

    function openPoll(id) {
      if (!state.polls.has(id)) {
        if (state.polls.size) toast("That poll doesn't exist — showing another one.", "err");
        id = state.polls.keys().next().value;
        if (!id) return;
        history.replaceState(null, "", "#/" + encodeURIComponent(id));
      }
      state.currentId = id;
      state.selected = null;
      buildOptions();
      renderSidebar();
    }
    const idFromHash = () => decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    window.addEventListener("hashchange", () => openPoll(idFromHash()));

    // ---------- Voting ----------
    async function vote() {
      const p = current();
      if (!p || p.youVoted || state.selected === null) return;
      const choice = state.selected;
      $("#voteBtn").disabled = true;
      try {
        const res = await fetch(`/api/polls/${encodeURIComponent(p.id)}/vote`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ option: choice })
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 409) { p.youVoted = true; updateResults(); renderSidebar(); }
          throw new Error(data.error || "Vote failed");
        }
        data.myChoice = choice;
        state.polls.set(p.id, data);
        state.selected = null;
        updateResults();
        renderSidebar();
        confetti(color(choice));
        toast(`Vote counted for “${p.options[choice]}” 🎉`, "ok");
      } catch (err) {
        toast(err.message, "err");
        updateResults();
      }
    }
    $("#voteBtn").onclick = vote;

    document.addEventListener("keydown", (e) => {
      if ($("#createDialog").open || e.target.tagName === "INPUT") return;
      const n = Number(e.key);
      const p = current();
      if (p && n >= 1 && n <= Math.min(9, p.options.length)) selectOption(n - 1);
      if (e.key === "Enter" && state.selected !== null) vote();
    });

    // ---------- Share ----------
    $("#shareBtn").onclick = async () => {
      const url = `${location.origin}/#/${encodeURIComponent(state.currentId)}`;
      try { await navigator.clipboard.writeText(url); toast("Link copied — send it to your friends! 📋", "ok"); }
      catch { prompt("Copy this link:", url); }
    };

    // ---------- Create poll ----------
    const dlg = $("#createDialog");
    function addOptionInput(value = "") {
      const box = $("#fOptions");
      if (box.children.length >= 20) { toast("Maximum 20 options", "err"); return; }
      const row = document.createElement("div");
      row.className = "opt-input";
      row.innerHTML = `<i></i><input maxlength="100" placeholder="Option" /><button type="button" title="Remove">✕</button>`;
      row.querySelector("input").value = value;
      row.querySelector("button").onclick = () => {
        if (box.children.length <= 2) { toast("A poll needs at least 2 options", "err"); return; }
        row.remove(); recolorInputs();
      };
      box.appendChild(row);
      recolorInputs();
      return row.querySelector("input");
    }
    function recolorInputs() {
      [...$("#fOptions").children].forEach((row, i) => {
        row.querySelector("i").style.background = color(i);
        row.querySelector("input").placeholder = `Option ${i + 1}`;
      });
    }
    $("#newPollBtn").onclick = () => {
      $("#createForm").reset();
      $("#fOptions").innerHTML = "";
      $("#formErr").textContent = "";
      addOptionInput(); addOptionInput();
      dlg.showModal();
      $("#fQuestion").focus();
    };
    $("#addOptBtn").onclick = () => addOptionInput()?.focus();
    $("#cancelBtn").onclick = () => dlg.close();

    function makeId(question) {
      const slug = question.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "poll";
      return `${slug}-${Math.random().toString(36).slice(2, 6)}`;
    }

    $("#createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = $("#fQuestion").value.trim();
      const options = [...$("#fOptions").querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean);
      if (!question) { $("#formErr").textContent = "Please write a question."; return; }
      if (options.length < 2) { $("#formErr").textContent = "Please fill in at least 2 options."; return; }
      try {
        const res = await fetch("/api/polls", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: makeId(question), question, options })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not create poll");
        state.polls.set(data.id, data);
        dlg.close();
        location.hash = "#/" + encodeURIComponent(data.id);
        confetti();
        toast("Poll created! Share it with the 🔗 button.", "ok");
      } catch (err) {
        $("#formErr").textContent = err.message;
      }
    });

    // ---------- Confetti ----------
    const canvas = $("#confetti");
    const ctx = canvas.getContext("2d");
    let pieces = [], animating = false;
    function confetti(main) {
      canvas.width = innerWidth; canvas.height = innerHeight;
      const colors = main ? [main, main, ...PALETTE] : PALETTE;
      for (let i = 0; i < 160; i++) {
        pieces.push({
          x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .45,
          vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 6,
          w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
          r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
          c: colors[Math.floor(Math.random() * colors.length)], life: 0
        });
      }
      if (!animating) { animating = true; requestAnimationFrame(tick); }
    }
    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.globalAlpha = Math.max(0, 1 - p.life / 140);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      pieces = pieces.filter(p => p.life < 140 && p.y < canvas.height + 40);
      if (pieces.length) requestAnimationFrame(tick);
      else { animating = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
    }

    // ---------- Live updates ----------
    function mergePoll(poll) {
      const old = state.polls.get(poll.id);
      // Socket payloads don't know who *this* browser is, so keep our own voted state
      poll.youVoted = old?.youVoted || false;
      poll.myChoice = old?.myChoice;
      state.polls.set(poll.id, poll);
    }

    // Load the Socket.IO client without blocking the page; fall back to polling if it fails
    (function loadSocketClient() {
      let settled = false;
      const done = (ok) => { if (settled) return; settled = true; ok ? startLive() : startPollingFallback(); };
      const s = document.createElement("script");
      s.src = "https://cdn.socket.io/4.7.2/socket.io.min.js";
      s.onload = () => done(typeof io === "function");
      s.onerror = () => done(false);
      document.head.appendChild(s);
      setTimeout(() => done(false), 8000);
    })();

    // If the Socket.IO script couldn't load (offline / CDN blocked), refresh by polling instead
    function startPollingFallback() {
      $("#online").textContent = "Live updates off — refreshing every 5s";
      setInterval(async () => {
        try {
          const polls = await (await fetch("/api/polls")).json();
          polls.forEach(p => {
            const old = state.polls.get(p.id);
            p.myChoice = old?.myChoice;
            if (!old) addActivity(`New poll: <b>${esc(p.question)}</b>`);
            else if (p.id === state.currentId) {
              // Report votes that arrived since the last refresh
              p.votes.forEach((v, i) => {
                for (let k = old.votes[i]; k < v; k++) addActivity(`Someone voted for <b>${esc(p.options[i])}</b>`, color(i));
              });
            }
            state.polls.set(p.id, p);
          });
          renderSidebar(); updateResults();
        } catch { /* server unreachable; try again next tick */ }
      }, 5000);
    }

    function startLive() {
    const socket = io();
    socket.on("connect", () => { $("#liveDot").classList.remove("off"); });
    socket.on("disconnect", () => { $("#liveDot").classList.add("off"); $("#online").textContent = "Reconnecting…"; });
    socket.on("presence", ({ online }) => {
      $("#online").textContent = `${online} ${online === 1 ? "person" : "people"} online`;
    });
    socket.on("poll:bootstrap", (polls) => {
      if (!state.currentId) return; // initial load comes from fetch below
      polls.forEach(mergePoll);
      renderSidebar(); updateResults();
    });
    socket.on("poll:update", ({ id, poll, lastVote }) => {
      mergePoll(poll);
      renderSidebar();
      if (id !== state.currentId) return;
      updateResults();
      if (lastVote != null) {
        const tile = document.querySelector(`.opt[data-idx="${lastVote}"]`);
        if (tile) { tile.classList.remove("pulse"); void tile.offsetWidth; tile.classList.add("pulse"); }
        addActivity(`Someone voted for <b>${esc(poll.options[lastVote])}</b>`, color(lastVote));
      }
    });
    socket.on("poll:created", (poll) => {
      const isNew = !state.polls.has(poll.id);
      mergePoll(poll);
      renderSidebar();
      if (isNew) {
        addActivity(`New poll: <b>${esc(poll.question)}</b>`);
        toast(`New poll: ${poll.question}`, "info");
      }
    });
    }

    // ---------- Start ----------
    (async function init() {
      try {
        const res = await fetch("/api/polls");
        const polls = await res.json();
        polls.forEach(p => state.polls.set(p.id, p));
        openPoll(idFromHash() || polls[0]?.id);
        if (!polls.length) $("#question").textContent = "No polls yet — create one! ✨";
      } catch {
        $("#question").textContent = "Couldn't reach the server 😕";
        toast("Couldn't load polls. Is the server running?", "err");
      }
    })();
  </script>
</body>
</html>
